name: Supabase keep-alive

on:
  schedule:
    - cron: '17 8 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la tabla ranking
        run: |
          curl -fsS "https://hicrocsgqcfwilpuhqoo.supabase.co/rest/v1/ranking?select=*&limit=1" \
            -H "apikey: sb_publishable_2ppgnZ9CetTDMOY1g3XgFA_B8Ggb_l7" \
            -o /dev/null -w "HTTP %{http_code}\n"

      - name: Mantener el workflow activo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
